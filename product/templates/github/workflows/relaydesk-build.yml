name: RelayDesk Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - product/relaydesk-v1
      - "release/**"
    tags:
      - "relaydesk-phase*"
      - "v*"

permissions:
  contents: read

concurrency:
  group: relaydesk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materials-diagnostic:
    name: Development materials diagnostic
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate development package
        if: ${{ hashFiles('product/scripts/validate-package.py') != '' }}
        run: python3 product/scripts/validate-package.py

  package:
    name: ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            runs-on: windows-2022
            arch: amd64
            qt-version: 6.10.1
            vcpkg-triplet: x64-windows-release
            package_variant: unsigned
            config-args: >-
              -G Ninja
              -DCMAKE_JOB_POOLS=relaydesk_link_pool=1
              -DCMAKE_JOB_POOL_LINK=relaydesk_link_pool
          - name: macos-arm64
            runs-on: macos-15
            arch: arm64
            # Qt 6.10.2 contains the upstream macdeployqt fix that signs the
            # main app binary after nested helpers ("nested code is modified
            # or invalid").
            qt-version: 6.10.2
            vcpkg-triplet: ""
            package_variant: adhoc
            config-args: >-
              -G Ninja
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14
              -DCMAKE_OSX_SYSROOT=${RELAYDESK_MACOS_SDK}

    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target.arch }}

      - name: Install upstream dependencies
        id: deps
        continue-on-error: true
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Retry upstream dependencies once
        id: deps_retry
        if: steps.deps.outcome == 'failure'
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Resolve macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: echo "RELAYDESK_MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSKIP_BUILD_TESTS=ON
          -DBUILD_TESTS=ON
          -DBUILD_INSTALLER=ON
          ${{ matrix.target.config-args }}
          ${{ steps.deps.outcome == 'success' && steps.deps.outputs.vcpkg-cmake-config || steps.deps_retry.outputs.vcpkg-cmake-config }}
          -DPACKAGE_VERSION_LABEL="${{ github.sha }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 8

      - name: Package binary and source
        id: package
        shell: bash
        run: |
          cmake --build build --config Release --target package --parallel 8
          cmake --build build --config Release --target package_source --parallel 8

      - name: Stage deployed macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage="$GITHUB_WORKSPACE/build/relaydesk-package-stage/$GITHUB_SHA"
          cmake -E rm -rf "$stage"
          cmake --install build --config Release --prefix "$stage"
          apps=("$stage"/*.app)
          if [[ "${#apps[@]}" -ne 1 || ! -d "${apps[0]}" ]]; then
            echo "Expected exactly one deployed app bundle in $stage" >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=4 "${apps[0]}"
          echo "RELAYDESK_EXPLICIT_APP=${apps[0]}" >> "$GITHUB_ENV"

      - name: Run tests and keep diagnostics
        id: tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.target.name }}
          set -o pipefail
          ctest --test-dir build/src/unittests -C Release --output-on-failure 2>&1 | tee dist/${{ matrix.target.name }}/ctest.log

      - name: Collect packages and SHA-256
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          args=(
            --build-dir build
            --out-dir dist/${{ matrix.target.name }}
            --platform ${{ matrix.target.name }}
            --commit ${{ github.sha }}
            --package-variant ${{ matrix.target.package_variant }}
          )
          if [[ -n "${RELAYDESK_EXPLICIT_APP:-}" ]]; then
            args+=(--app-bundle "$RELAYDESK_EXPLICIT_APP")
          fi
          python product/scripts/collect-ci-artifacts.py "${args[@]}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.target.name }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Package step: \`${{ steps.package.outcome }}\`"
            echo "- Test step: \`${{ steps.tests.outcome }}\`"
            echo "- Tests are diagnostic during development; this workflow is not a required check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload platform artifact and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaydesk-${{ matrix.target.name }}-${{ github.sha }}
          path: dist/${{ matrix.target.name }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report package or test failure
        if: always() && (steps.package.outcome != 'success' || steps.tests.outcome != 'success')
        shell: bash
        run: |
          echo "Package outcome: ${{ steps.package.outcome }}"
          echo "Test outcome: ${{ steps.tests.outcome }}"
          exit 1

  publish-tag-artifacts:
    name: Publish unsigned draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: relaydesk-*-${{ github.sha }}
          path: downloaded-artifacts

      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-artifacts -type f \( \
            -name '*.msi' -o -name '*.7z' -o -name '*.dmg' -o \
            -name '*.app.zip' -o -name '*-Source*.zip' -o -name '*-Source.tar.*' \
          \) -exec cp '{}' release-assets/ \;
          while IFS= read -r manifest; do
            artifact_name=$(basename "$(dirname "$manifest")")
            platform=$(printf '%s' "$artifact_name" | sed -E 's/^relaydesk-(windows-x64|macos-arm64)-.*/\1/')
            cp "$manifest" "release-assets/SHA256SUMS-${platform}.txt"
          done < <(find downloaded-artifacts -type f -name SHA256SUMS.txt | sort)
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 |
              sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "RelayDesk internal $GITHUB_REF_NAME" \
              --notes "Unsigned internal Windows and macOS packages built from $GITHUB_SHA."
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
